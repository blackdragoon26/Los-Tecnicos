services:
  - type: web
    name: los-tecnicos-backend
    runtime: docker
    region: singapore
    plan: free
    rootDir: backend
    envVars:
      - key: PORT
        value: 8080
      - key: STELLAR_NETWORK
        value: testnet
      - key: SQLITE_DB_PATH
        value: /tmp/los_tecnicos_demo.db
      - key: REDIS_ADDR
        fromService:
          type: redis
          name: los-tecnicos-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MQTT_BROKER_ADDR
        sync: false

  - type: redis
    name: los-tecnicos-redis
    region: singapore
    plan: free
    ipAllowList: [] # Only allow internal connections
